name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test deps
        run: npm install --no-save jiti typebox
      - name: Run e2e
        run: node test/e2e.mjs
